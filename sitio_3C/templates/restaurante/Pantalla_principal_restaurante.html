<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menú del Restaurante</title>
  <link rel="stylesheet" href="/static/css/restaurante/styles.css" />
</head>
<body>
  <header class="main-header">
        <div class="brand">3C</div>
        <nav class="nav-menu">
            <a href="/restaurante/promociones" class="nav-link">Promociones</a>
            <!-- Cambiado a un botón para manejar el clic -->
        <button id="btn-perfil" class="nav-link active" style="cursor: pointer;">
            Restaurante
        </button>

        <!-- Menú oculto por defecto -->
        <div id="menu-opciones" class="context-menu" style="display: none;">
            <div class="menu-option cerrarSesion-boton">Cerrar Sesión</div>
        </div>
    </nav>
        </nav>
    </header>

  <main>
    <div class="menu-grid" id="menu-grid">
      <!-- Tarjeta para Agregar Elemento -->
      <div class="card add-card" id="openModal">
        <div class="add-button">+</div>
        <h3>Agregar Platillo</h3>
      </div>

      <!-- Tarjetas de Platillos (ejemplo) -->
      <div class="card">
        <img src="platillo1.jpg" alt="Platillo 1">
        <h3>Enchiladas</h3>
        <p>Deliciosas enchiladas rojas con pollo.</p>
        <div class="price">$120</div>
        <div class="context-menu">
          <div class="menu-option modificar-btn">Modificar</div>
          <div class="menu-option borrar-btn">Eliminar</div>
        </div>
      </div>

      <div class="card">
        <img src="platillo2.jpg" alt="Platillo 2">
        <h3>Tacos al Pastor</h3>
        <p>Tacos de piña y carne asada.</p>
        <div class="price">$80</div>
        <div class="context-menu">
          <div class="menu-option modificar-btn">Modificar</div>
          <div class="menu-option borrar-btn">Eliminar</div>
        </div>
      </div>

      <div class="card">
        <img src="platillo3.jpg" alt="Platillo 3">
        <h3>Pozole</h3>
        <p>Tradicional pozole rojo.</p>
        <div class="price">$110</div>
        <div class="context-menu">
          <div class="menu-option modificar-btn">Modificar</div>
          <div class="menu-option borrar-btn">Eliminar</div>
        </div>
      </div>
    </div>
  </main>

<!-- Modal para Agregar Platillo -->
<div id="addItemModal" class="modal">
  <div class="modal-content">
  <span class="close">&times;</span>
    <div class="image-placeholder" id="imageUpload">
      <img src="placeholder-icon.png" alt="Subir imagen">
      <p>Subir imagen</p>
    </div>
    <form id="addItemForm" class="form-fields">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>
      </div>
      <div class="form-group">
        <label for="precio">Precio</label>
        <input type="number" id="precio" name="precio" required step="0.01">
      </div>
      <div class="modal-buttons">
        <button type="submit" class="btn-guardar">Agregar</button>
        <button type="button" class="btn-cancelar">Cancelar</button>
      </div>
    </form>
  </div>
</div>


  <script src="/static/js/restaurante/agregarElemento.js"></script>
  <script src="/static/js/restaurante/opcionesPerfil.js"></script>
</body>
</html>
