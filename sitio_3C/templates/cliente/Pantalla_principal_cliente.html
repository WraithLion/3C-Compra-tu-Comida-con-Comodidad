<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menú del Restaurante</title>
  <link rel="stylesheet" href="/static/css/cliente/styles.css" />
</head>
<body>
  <header class="main-header">
    <div class="brand">3C</div>
    <nav class="nav-menu">
        <a href="/cliente" class="nav-link">Restaurantes</a>
        <a href="/carrito" class="nav-link active">Carrito</a>

        <!-- Cambiado a un botón para manejar el clic -->
        <button id="btn-perfil" class="nav-link active" style="cursor: pointer;">
            Perfil
        </button>

        <!-- Menú oculto por defecto -->
        <div id="context-menu" class="context-menu" style="display: none;">
            <div class="menu-option cerrarSesion-boton">Cerrar Sesión</div>
        </div>
    </nav>
</header>

<main>
  <!-- Contenedor de Restaurantes -->
  <div class="menu-grid" id="lista-restaurantes">
    <div class="card" data-restaurante="restaurante1">
      <img src="platillo1.jpg" alt="Restaurante 1">
      <h3>Restaurante 1</h3>
    </div>

    <div class="card" data-restaurante="restaurante2">
      <img src="platillo2.jpg" alt="Restaurante 2">
      <h3>Restaurante 2</h3>
    </div>

    <div class="card" data-restaurante="restaurante3">
      <img src="platillo3.jpg" alt="Restaurante 3">
      <h3>Restaurante 3</h3>
    </div>
  </div>

  <!-- Contenedor del Menú (inicialmente oculto o vacío) -->
  <section id="menu-detalle" class="menu-detalle" style="display: none; margin-top: 20px;">
    <h2 id="titulo-menu">Menú</h2>
    <ul id="lista-platillos"></ul>
  </section>
</main>

<script src="/static/js/cliente/opcionesPerfil.js"></script>
<script src="/static/js/cliente/cargarMenuRestaurante.js"></script>


</body>
</html>
